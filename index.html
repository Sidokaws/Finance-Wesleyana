<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">

  <title>Finance Wesleyana — acesso privado</title>
  <style>
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(circle at 50% -10%,#123c7d 0,transparent 38%),linear-gradient(145deg,#020714,#07142b 55%,#030918);color:#f6f8ff;font-family:Inter,system-ui,sans-serif}
    main{width:min(430px,100%);padding:42px;border:1px solid rgba(133,182,255,.25);border-radius:28px;background:rgba(5,19,43,.9);box-shadow:0 30px 110px rgba(0,4,17,.7);text-align:center}
    .mark{display:grid;width:54px;height:54px;margin:0 auto 24px;place-items:center;border:1px solid rgba(136,185,255,.34);border-radius:17px;background:linear-gradient(145deg,#153f7e,#06152f);color:#9bc7ff;font-weight:900}
    p{margin:0;color:#91a6c8;line-height:1.7}h1{margin:0 0 12px;font-size:2rem;letter-spacing:-.05em}.status{display:inline-flex;align-items:center;gap:8px;margin-top:26px;color:#9bc7ff;font-size:.78rem}.status i{width:7px;height:7px;border-radius:50%;background:#68dfa0;box-shadow:0 0 12px rgba(104,223,160,.7)}
  </style>
</head>
<body>
  <main>
    <div class="mark">FW</div>
    <h1>Finance Wesleyana</h1>
    <p>Este painel agora é particular. O endereço de acesso não é divulgado nesta página.</p>
    <div class="status"><i></i> Acesso privado ativado</div>
  </main>
</body>
